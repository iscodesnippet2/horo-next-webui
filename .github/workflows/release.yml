# Build one upstream Hermes WebUI release as horo-next-webui and publish it.
#
#   upstream tag  ──overlay──▶  Python floors  ──▶  front-end libraries
#   ──▶  pinned dependencies  ──▶  SBOM + notices  ──▶  sdist  ──▶  wheel built from it
#   ──▶  advisory audit
#   ──▶  verify on every supported Python  ──▶  TestPyPI  ──▶  (approval)
#   ──▶  PyPI + GitHub release
#
# Upstream code is never committed to this repository. Each run clones the tag
# fresh, so a release is a pure function of (upstream tag, overlay/) — and of
# the advisory databases on the day it runs.
#
# Publishing uses PyPI Trusted Publishing: no API token is stored here.
name: release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag, e.g. v0.52.113 or exp-v0.52.416"
        required: true
      version:
        description: "Version: 0.52.416, 0.52.416.N for a horo revision, either with .postN for a rebuild"
        required: true
      publish:
        description: "Publish after verification (false = build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pythons: ${{ steps.meta.outputs.pythons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Mermaid is rebuilt with esbuild so its embedded DOMPurify is a fixed release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The gate itself, offline, against fakes: a rejected token, an unanswered
      # component, a fix inside the cooldown must each hold a release.
      - name: Test the release gate
        run: uv run --with packaging python -m unittest discover -s overlay/tests -p 'test_*.py'

      # Before any step that puts the inputs in a command, and through the environment.
      - name: Check the version against the upstream tag
        env:
          VERSION: ${{ inputs.version }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python3 overlay/release_version.py "$VERSION" "$UPSTREAM_TAG"

      - name: Clone the upstream release
        run: |
          git clone --depth 1 --branch "${{ inputs.upstream_tag }}" \
            https://github.com/nesquena/hermes-webui.git upstream

      - name: Apply the packaging overlay
        run: uv run --with packaging python overlay/horo_overlay.py upstream "${{ inputs.version }}"

      - name: Raise vulnerable Python dependency floors
        env:
          SONATYPE_GUIDE_TOKEN: ${{ secrets.SONATYPE_GUIDE_TOKEN }}
        run: uv run --with packaging python overlay/security_bump.py upstream --notes release-notes.md

      - name: Self-host front-end libraries at advisory-free versions
        # npm 11: same as horo-next, for lockfile behaviour consistent across runs.
        env:
          HORO_NPM: npx -y npm@11.21.0
          # Versions are chosen clean in OSV and in Sonatype.
          SONATYPE_GUIDE_TOKEN: ${{ secrets.SONATYPE_GUIDE_TOKEN }}
        run: uv run --with packaging python overlay/vendor_assets.py upstream --notes release-notes.md

      # The air-gapped target is Linux / CPython 3.12. What `pip install
      # horo-next-webui` resolves today, outside the 14-day cooldown, is the
      # offline list. A vulnerable resolved package holds the release at the
      # audit below: nothing newer is allowed, so there is nothing to raise to.
      - name: Pin the dependency set for Linux / Python 3.12
        run: |
          args="--python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header -q"
          args="$args --exclude-newer $(uv run python overlay/cooldown.py)"
          uv pip compile upstream/requirements.txt $args -o "requirements-${{ inputs.version }}.txt"
          uv pip compile upstream/requirements.txt $args --generate-hashes \
            -o "requirements-${{ inputs.version }}-hashes.txt"

      - name: Generate the SBOM and third-party notices
        run: |
          uv run python overlay/sbom.py generate upstream "${{ inputs.version }}" "${{ inputs.upstream_tag }}" \
            --requirements "requirements-${{ inputs.version }}.txt" --out horo-next-webui.cdx.json
          cp upstream/THIRD_PARTY_LICENSES THIRD_PARTY_LICENSES.txt

      # The sdist is for developing offline: the same tree plus upstream's tests,
      # where it came from, and the overlay that made it (overlay/DEVELOPING.md).
      - name: Prepare the source distribution
        env:
          HORO_OVERLAY_COMMIT: ${{ github.sha }}
        run: uv run python overlay/source_dist.py prepare upstream "${{ inputs.version }}" "${{ inputs.upstream_tag }}"

      # Without --wheel, uv builds the sdist and then the wheel from it.
      - name: Build the sdist and the wheel
        working-directory: upstream
        run: uv build --out-dir ../dist

      - name: Embed the SBOM in the wheel (PEP 770)
        run: |
          uv run python overlay/sbom.py embed "dist/horo_next_webui-${{ inputs.version }}-py3-none-any.whl" \
            horo-next-webui.cdx.json --release-copy "horo-next-webui-${{ inputs.version }}.cdx.json"

      # The enterprise mirror is guarded by Sonatype. Every shipped component —
      # Python and npm, bundled ones included — must be clean in OSV and in
      # Sonatype's public data. The same check reruns on demand (rescan.yml).
      - name: Audit every shipped component against OSV and Sonatype
        env:
          SONATYPE_GUIDE_TOKEN: ${{ secrets.SONATYPE_GUIDE_TOKEN }}
        run: |
          echo "" >> release-notes.md
          echo "## Shipped-component audit — OSV and Sonatype" >> release-notes.md
          uv run python overlay/audit_shipped.py "horo-next-webui-${{ inputs.version }}.cdx.json" \
            --notes release-notes.md --json "audit-${{ inputs.version }}.json"

      - name: Check the release files against each other
        run: |
          v="${{ inputs.version }}"
          files="dist/horo_next_webui-$v-py3-none-any.whl horo-next-webui-$v.cdx.json THIRD_PARTY_LICENSES.txt requirements-$v.txt requirements-$v-hashes.txt audit-$v.json $v"
          uv run --with 'cyclonedx-python-lib[json-validation]==11.12.0' python overlay/verify_release.py $files
          uv run --with 'cyclonedx-python-lib[json-validation]==11.12.0' python overlay/tests/mutate_release.py $files

      # The sdist holds what the wheel installs and nothing third-party beyond it,
      # and builds the same wheel offline.
      - name: Check the source distribution against the wheel
        run: |
          v="${{ inputs.version }}"
          uv run python overlay/source_dist.py verify "dist/horo_next_webui-$v.tar.gz" \
            "dist/horo_next_webui-$v-py3-none-any.whl" "$v"

      - id: meta
        run: echo "pythons=$(jq -c .pythons upstream/horo-build.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md
            requirements-${{ inputs.version }}.txt
            requirements-${{ inputs.version }}-hashes.txt
            horo-next-webui-${{ inputs.version }}.cdx.json
            audit-${{ inputs.version }}.json
            THIRD_PARTY_LICENSES.txt
            airgap/probe.py
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(needs.build.outputs.pythons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Install into a clean venv and check it works
        run: |
          uv run --with packaging python overlay/verify_wheel.py \
            dist/horo_next_webui-${{ inputs.version }}-py3-none-any.whl \
            "${{ matrix.python }}" "${{ inputs.version }}"

      - name: Install the hashed dependency set
        if: matrix.python == '3.12'
        run: |
          uv venv --python 3.12 hashed
          uv pip install --python hashed/bin/python --require-hashes -r "requirements-${{ inputs.version }}-hashes.txt"
          uv pip install --python hashed/bin/python --no-deps dist/horo_next_webui-${{ inputs.version }}-py3-none-any.whl
          uv pip check --python hashed/bin/python

      # Serving every file is not the same as working: run upstream's own
      # Mermaid, KaTeX, PDF.js, Prism and xterm paths in Chromium, offline.
      - name: Render the front end in a browser
        run: |
          uvx --from playwright==1.64.0 playwright install --with-deps chromium
          uv run --with playwright==1.64.0 python overlay/browser_smoke.py \
            dist/horo_next_webui-${{ inputs.version }}-py3-none-any.whl "${{ matrix.python }}"

  testpypi:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      # skip-existing: a version can be uploaded to TestPyPI only once; a re-run
      # after a rejected PyPI step must still be able to reach it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # The `pypi` environment should require a reviewer (repository settings).
  # A version uploaded to PyPI can never be uploaded again, even if deleted.
  pypi:
    if: inputs.publish
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: GitHub release with notes and the offline dependency list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "horo-next-webui ${{ inputs.version }} (upstream ${{ inputs.upstream_tag }})" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz \
            "requirements-${{ inputs.version }}.txt" \
            "requirements-${{ inputs.version }}-hashes.txt" \
            "horo-next-webui-${{ inputs.version }}.cdx.json" \
            "audit-${{ inputs.version }}.json" \
            THIRD_PARTY_LICENSES.txt \
            airgap/probe.py
