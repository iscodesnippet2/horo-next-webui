# Re-audit the latest published release every day.
#
# A release is clean on the day it is built. Advisories published afterwards
# — in OSV or in Sonatype's data, which the enterprise mirror enforces — are
# found here, and an issue is opened so a .postN release can follow.
name: rescan

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Fetch the latest release's component lists
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "No release published yet."; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh release download "$tag" --repo "${{ github.repository }}" \
            --pattern 'requirements-*.txt' --pattern 'horo-vendor-*.json' --dir rel
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Audit against OSV and Sonatype
        id: audit
        if: steps.rel.outputs.tag != ''
        env:
          SONATYPE_GUIDE_TOKEN: ${{ secrets.SONATYPE_GUIDE_TOKEN }}
        run: |
          uv run --with packaging python overlay/audit_shipped.py \
            rel/requirements-*.txt rel/horo-vendor-*.json --report report.md

      - name: Open or update an issue
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="New advisory in ${{ steps.rel.outputs.tag }}"
          body="$(printf 'The daily rescan found advisories in the latest release, or could not check Sonatype.\n\nRun: %s\n\n```\n%s\n```\n\nRebuild the same upstream tag as X.Y.Z.postN.' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(cat report.md 2>/dev/null)")"
          num=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --repo "${{ github.repository }}" --body "$body"
          else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi
